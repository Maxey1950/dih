# Local development services. Only PostgreSQL for now.
# Usage: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: revival
      POSTGRES_PASSWORD: revival   # local development only
      POSTGRES_DB: revival
    ports:
      - "127.0.0.1:5432:5432"      # bound to localhost only
    volumes:
      - revival-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revival -d revival"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  revival-pg:
