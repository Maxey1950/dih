[package]
name = "ourrevival-launcher"
version = "0.1.0"
edition = "2021"
description = "Handles ourrevival://join?ticket=... links: resolves the one-time ticket and starts the RFD v347 player."
license = "MIT"
publish = false

[[bin]]
name = "ourrevival-launcher"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
strip = true
lto = true
